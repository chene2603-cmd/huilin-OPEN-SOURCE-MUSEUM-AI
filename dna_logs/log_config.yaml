# DNA系统日志配置
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(name)s | %(levelname)s | DNA:%(dna_module)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    format: '{"timestamp": "%(asctime)s", "module": "%(name)s", "level": "%(levelname)s", "dna_module": "%(dna_module)s", "message": "%(message)s", "function": "%(funcName)s", "line": "%(lineno)d"}'
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: json
    filename: dna_logs/dna_system.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf-8
  
  error_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: ERROR
    formatter: json
    filename: dna_logs/dna_errors.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf-8
  
  api_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: json
    filename: dna_logs/dna_api.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf-8
  
  performance_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: json
    filename: dna_logs/dna_performance.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf-8

loggers:
  dna_core:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  dna_apis:
    level: INFO
    handlers: [console, api_file]
    propagate: false
  
  dna_monitor:
    level: INFO
    handlers: [console, file, performance_file]
    propagate: false
  
  dna_expression:
    level: INFO
    handlers: [console, file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]